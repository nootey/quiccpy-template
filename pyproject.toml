[project]
name = "quiccpy-start"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "structlog>=25.0.0",
    "colorama>=0.4.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    "ruff>=0.15.15",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
explicit_package_bases = true

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "S", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*"]
# Also measure the app when tests start it as a subprocess
patch = ["subprocess"]
